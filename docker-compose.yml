version: '3.8'

services:
  # Training service
  ml-train:
    build:
      context: .
      dockerfile: Dockerfile
    image: ml-app:latest
    container_name: ml-app-train
    volumes:
      - ./models:/app/models
      - ./:/app/output
    command: python src/train.py
    environment:
      - PYTHONUNBUFFERED=1

  # API service
  ml-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ml-app:latest
    container_name: ml-app-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    command: python src/app.py
    environment:
      - PORT=8000
      - MODEL_PATH=models/iris_classifier.pkl
      - PYTHONUNBUFFERED=1
    depends_on:
      - ml-train
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

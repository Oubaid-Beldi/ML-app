name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run linter (flake8)
      run: |
        echo "Running flake8 linter..."
        flake8 src/ --count --statistics --format=default
      continue-on-error: false
    
    - name: Run tests with pytest
      run: |
        echo "Running tests..."
        pytest tests/ -v --tb=short --junitxml=test-results.xml
      continue-on-error: false
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: test-results.xml
        retention-days: 30
    
    - name: Generate test coverage report
      run: |
        pip install pytest-cov
        pytest tests/ --cov=src --cov-report=xml --cov-report=html
      continue-on-error: true
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: |
          coverage.xml
          htmlcov/
        retention-days: 30

  build-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t ml-app:${{ github.sha }} .
        docker tag ml-app:${{ github.sha }} ml-app:latest
    
    - name: Test Docker image
      run: |
        echo "Testing Docker image..."
        docker run --rm ml-app:latest python --version
    
    - name: Save Docker image as artifact
      run: |
        docker save ml-app:latest -o ml-app-image.tar
        gzip ml-app-image.tar
    
    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: ml-app-image.tar.gz
        retention-days: 7
    
    - name: Display image info
      run: |
        echo "Docker image built successfully!"
        docker images | grep ml-app
        ls -lh ml-app-image.tar.gz
